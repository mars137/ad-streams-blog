<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#29b5e8"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">End-to-End Data Flow</text>
  <text x="600" y="55" text-anchor="middle" fill="#64748b" font-size="12">Ad events to propensity scores in &lt;1 minute latency</text>

  <!-- Layer labels -->
  <text x="100" y="90" fill="#475569" font-size="10" font-weight="600">INGEST</text>
  <text x="340" y="90" fill="#475569" font-size="10" font-weight="600">TRANSFORM</text>
  <text x="620" y="90" fill="#475569" font-size="10" font-weight="600">SCORE</text>
  <text x="860" y="90" fill="#475569" font-size="10" font-weight="600">SERVE</text>
  <text x="1060" y="90" fill="#475569" font-size="10" font-weight="600">APP</text>

  <!-- Ingest -->
  <rect x="40" y="110" width="180" height="70" rx="10" fill="#0c4a6e" stroke="#29b5e8" stroke-width="1.5"/>
  <text x="130" y="140" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">Datastream</text>
  <text x="130" y="158" text-anchor="middle" fill="#94a3b8" font-size="10">(Kafka-compatible)</text>
  <text x="130" y="173" text-anchor="middle" fill="#64748b" font-size="9">Broker :9093</text>

  <rect x="40" y="200" width="180" height="50" rx="10" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
  <text x="130" y="222" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">Snowpipe Streaming</text>
  <text x="130" y="240" text-anchor="middle" fill="#64748b" font-size="9">MARKETING_PIPE / CONVERSION_PIPE</text>

  <!-- Arrow ingest to bronze -->
  <line x1="220" y1="225" x2="280" y2="225" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <rect x="290" y="110" width="180" height="50" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="380" y="133" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">raw_marketing_events</text>
  <text x="380" y="150" text-anchor="middle" fill="#64748b" font-size="9">22.9M rows (bronze)</text>

  <rect x="290" y="170" width="180" height="50" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="380" y="193" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">raw_conversion_events</text>
  <text x="380" y="210" text-anchor="middle" fill="#64748b" font-size="9">1.2M rows (bronze)</text>

  <!-- DT Features -->
  <rect x="290" y="240" width="180" height="60" rx="10" fill="#0c4a6e" stroke="#29b5e8" stroke-width="1.5"/>
  <text x="380" y="263" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">dt_user_features</text>
  <text x="380" y="280" text-anchor="middle" fill="#94a3b8" font-size="9">MERGE INTO SELF</text>
  <text x="380" y="293" text-anchor="middle" fill="#64748b" font-size="9">clicks/impr/PS 1h/24h/7d</text>

  <!-- Arrow bronze to features -->
  <line x1="380" y1="160" x2="380" y2="170" stroke="#475569" stroke-width="1"/>
  <line x1="380" y1="220" x2="380" y2="240" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow features to scoring -->
  <line x1="470" y1="270" x2="570" y2="270" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Score -->
  <rect x="580" y="190" width="180" height="50" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="670" y="213" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Model Registry</text>
  <text x="670" y="230" text-anchor="middle" fill="#64748b" font-size="9">AD_PROPENSITY_MODEL!PREDICT_PROBA</text>

  <rect x="580" y="250" width="180" height="60" rx="10" fill="#0c4a6e" stroke="#29b5e8" stroke-width="1.5"/>
  <text x="670" y="273" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">dt_user_propensity</text>
  <text x="670" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">Dynamic Table (incremental)</text>
  <text x="670" y="303" text-anchor="middle" fill="#64748b" font-size="9">user_id, score, bucket</text>

  <!-- Arrow model to DT -->
  <line x1="670" y1="240" x2="670" y2="250" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow to serve -->
  <line x1="760" y1="280" x2="830" y2="280" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Serve -->
  <rect x="840" y="240" width="180" height="70" rx="10" fill="#0c4a6e" stroke="#29b5e8" stroke-width="1.5"/>
  <text x="930" y="263" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">Interactive Table</text>
  <text x="930" y="280" text-anchor="middle" fill="#94a3b8" font-size="9">propensity_dashboard</text>
  <text x="930" y="296" text-anchor="middle" fill="#64748b" font-size="9">CLUSTER BY (bucket, user_id)</text>

  <rect x="840" y="320" width="180" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="930" y="344" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Interactive Warehouse</text>
  <text x="930" y="356" text-anchor="middle" fill="#64748b" font-size="9">XSMALL, always-on cache</text>

  <!-- Arrow to app -->
  <line x1="1020" y1="275" x2="1040" y2="275" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- App -->
  <rect x="1050" y="200" width="120" height="100" rx="10" fill="#0c4a6e" stroke="#29b5e8" stroke-width="1.5"/>
  <text x="1110" y="230" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">App Runtime</text>
  <text x="1110" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">Next.js</text>
  <text x="1110" y="270" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">Cortex AI</text>
  <text x="1110" y="286" text-anchor="middle" fill="#64748b" font-size="9">AI_COMPLETE</text>

  <!-- Latency badges -->
  <rect x="220" y="320" width="90" height="22" rx="11" fill="#065f46" opacity="0.8"/>
  <text x="265" y="335" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">~seconds</text>

  <rect x="530" y="320" width="90" height="22" rx="11" fill="#065f46" opacity="0.8"/>
  <text x="575" y="335" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">1 min lag</text>

  <rect x="975" y="370" width="90" height="22" rx="11" fill="#065f46" opacity="0.8"/>
  <text x="1020" y="385" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">&lt;100ms reads</text>
</svg>