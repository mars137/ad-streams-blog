<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">The Stack, Then and Now</text>

  <!-- Header row -->
  <rect x="40" y="55" width="300" height="35" rx="6" fill="#7f1d1d" opacity="0.5"/>
  <text x="190" y="78" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">2017 (a month)</text>
  <rect x="360" y="55" width="300" height="35" rx="6" fill="#0c4a6e" opacity="0.5"/>
  <text x="510" y="78" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">2026 (an hour)</text>
  <rect x="680" y="55" width="180" height="35" rx="6" fill="#1e1b4b" opacity="0.5"/>
  <text x="770" y="78" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">What changed</text>

  <!-- Row 1 -->
  <rect x="40" y="100" width="300" height="45" rx="4" fill="#1e293b"/>
  <text x="60" y="120" fill="#f8fafc" font-size="11" font-weight="600">Apache Kafka</text>
  <text x="60" y="136" fill="#64748b" font-size="9">Brokers, ZooKeeper, partitions</text>
  <rect x="360" y="100" width="300" height="45" rx="4" fill="#0f2942"/>
  <text x="380" y="120" fill="#7dd3fc" font-size="11" font-weight="600">Snowflake Datastream</text>
  <text x="380" y="136" fill="#64748b" font-size="9">Kafka-compatible, fully managed</text>
  <rect x="680" y="100" width="180" height="45" rx="4" fill="#1e1b4b" opacity="0.4"/>
  <text x="700" y="127" fill="#94a3b8" font-size="9">Zero ops</text>

  <!-- Row 2 -->
  <rect x="40" y="155" width="300" height="45" rx="4" fill="#1e293b"/>
  <text x="60" y="175" fill="#f8fafc" font-size="11" font-weight="600">Kafka Connect</text>
  <text x="60" y="191" fill="#64748b" font-size="9">Sink connector, serialization fights</text>
  <rect x="360" y="155" width="300" height="45" rx="4" fill="#0f2942"/>
  <text x="380" y="175" fill="#7dd3fc" font-size="11" font-weight="600">Snowpipe Streaming</text>
  <text x="380" y="191" fill="#64748b" font-size="9">Pipes auto-land into bronze tables</text>
  <rect x="680" y="155" width="180" height="45" rx="4" fill="#1e1b4b" opacity="0.4"/>
  <text x="700" y="182" fill="#94a3b8" font-size="9">No serialization</text>

  <!-- Row 3 -->
  <rect x="40" y="210" width="300" height="45" rx="4" fill="#1e293b"/>
  <text x="60" y="230" fill="#f8fafc" font-size="11" font-weight="600">Kafka Streams + KTables</text>
  <text x="60" y="246" fill="#64748b" font-size="9">Windowed state, RocksDB, changelog</text>
  <rect x="360" y="210" width="300" height="45" rx="4" fill="#0f2942"/>
  <text x="380" y="230" fill="#7dd3fc" font-size="11" font-weight="600">Dynamic Tables (MERGE INTO SELF)</text>
  <text x="380" y="246" fill="#64748b" font-size="9">Declarative incremental refresh</text>
  <rect x="680" y="210" width="180" height="45" rx="4" fill="#1e1b4b" opacity="0.4"/>
  <text x="700" y="237" fill="#94a3b8" font-size="9">State is the platform's problem</text>

  <!-- Row 4 -->
  <rect x="40" y="265" width="300" height="45" rx="4" fill="#1e293b"/>
  <text x="60" y="285" fill="#f8fafc" font-size="11" font-weight="600">Python ML service</text>
  <text x="60" y="301" fill="#64748b" font-size="9">Own deploy, own scaling, own pages</text>
  <rect x="360" y="265" width="300" height="45" rx="4" fill="#0f2942"/>
  <text x="380" y="285" fill="#7dd3fc" font-size="11" font-weight="600">Model Registry + Experiment</text>
  <text x="380" y="301" fill="#64748b" font-size="9">Train, register, call as !PREDICT_PROBA</text>
  <rect x="680" y="265" width="180" height="45" rx="4" fill="#1e1b4b" opacity="0.4"/>
  <text x="700" y="292" fill="#94a3b8" font-size="9">Model is an immutable function</text>

  <!-- Row 5 -->
  <rect x="40" y="320" width="300" height="45" rx="4" fill="#1e293b"/>
  <text x="60" y="340" fill="#f8fafc" font-size="11" font-weight="600">Cassandra</text>
  <text x="60" y="356" fill="#64748b" font-size="9">CDC sync, sub-second by user_id</text>
  <rect x="360" y="320" width="300" height="45" rx="4" fill="#0f2942"/>
  <text x="380" y="340" fill="#7dd3fc" font-size="11" font-weight="600">Interactive Table + Warehouse</text>
  <text x="380" y="356" fill="#64748b" font-size="9">Same data, sub-second, no sync</text>
  <rect x="680" y="320" width="180" height="45" rx="4" fill="#1e1b4b" opacity="0.4"/>
  <text x="700" y="347" fill="#94a3b8" font-size="9">Source of truth IS the serve</text>

  <!-- Row 6 -->
  <rect x="40" y="375" width="300" height="35" rx="4" fill="#1e293b"/>
  <text x="60" y="397" fill="#f8fafc" font-size="11" font-weight="600">Flask app + CORS + manual deploy</text>
  <rect x="360" y="375" width="300" height="35" rx="4" fill="#0f2942"/>
  <text x="380" y="397" fill="#7dd3fc" font-size="11" font-weight="600">App Runtime (snow app deploy)</text>
  <rect x="680" y="375" width="180" height="35" rx="4" fill="#1e1b4b" opacity="0.4"/>
  <text x="700" y="397" fill="#94a3b8" font-size="9">One command, inherits RBAC</text>
</svg>